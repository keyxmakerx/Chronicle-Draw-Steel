  - title: Example tests
    blocks:
      - text: |
          A trio wants to climb a 40-foot castle wall. Step through how the
          tests go.
      - type: example
        title: Climbing the wall
        steps:
          - 'Director: The wall is smooth and built to repel climbers. That is a Might test, and I am keeping the difficulty secret. It is hard.'
          - 'The tactician goes first. She has Might 2 and the Climb skill, so +2 more. The dice show 13, for a total of 17.'
          - 'Tier 3 on a hard test is a success. She is on top and sees guards looking the other way.'
          - 'She drops a rope. With the rope the Director rates the conduit''s climb as easy. The conduit rolls 11 plus Might 2 for 13: tier 2, a success on an easy test.'
          - 'The shadow has Might -1 and no skills. The tactician offers to haul him up while he clings on. That is a medium Might test, and the Lift skill applies.'
          - 'She rolls 2, plus 2 for Might and 2 for Lift: 6. Tier 1 on a medium test is a failure.'
          - 'Director: Rather than leave him behind, you can pull him up and suffer the consequence of making noise. They agree: a lantern swings their way.'
      - type: callout
        title: What to notice
        text: |
          The rope changed the difficulty. A skill added to the characteristic
          but was not an edge. A failure was offered back as a success with
          a consequence. Nobody was left stuck: every result moved the story.
  - title: Assist, hide, group
    blocks:
      - type: flaps
        items:
          - title: Assist a test
            text: |
              You can help another creature's test if you have a skill that
              applies, they are not using that same skill, and you can
              describe your help sensibly. Shouting encouragement will not
              make anyone stealthier. You make a test with your skill and a
              characteristic the Director picks, and the result gives them a
              bonus, as the roller below shows.
          - title: Hiding
            text: |
              You can hide only if you have [[cover]] or [[concealment]] from
              a creature that is not observing you. Observing means they know
              your exact spot, as if shouting "there they are". You cannot
              hide from a dragon at your heels until you break its sight. In
              combat, the Hide maneuver makes you [[hidden]] automatically
              unless the Director says otherwise. Out of combat the Director
              may ask for a Hide test.
          - title: What hidden does
            text: |
              Creatures cannot target you with abilities that lack the Area
              keyword, and you gain an edge on ability rolls against them,
              lasting until the end of the turn you stop being hidden. You
              stop being hidden when you lose cover or concealment, or after
              you use an ability, interact with an enemy, move without
              sneaking or make noise. The activity resolves first, then you
              are revealed.
          - title: Searching for hidden creatures
            text: |
              As a maneuver, make an Intuition test with the Search skill.
              Each hidden creature within 10 squares that you have line of
              effect to makes an opposed Agility test with Hide. If you beat
              one, it is no longer hidden from you, and you can point it out
              to allies within 10 squares. If a creature is hidden from your
              allies but not from you, pointing it out is a maneuver with no
              test. The Director may swap in other characteristics and skills.
          - title: Sneaking
            text: |
              While hidden and out of combat, you can sneak to stay hidden as
              you move: your speed is halved and you make an Agility test
              with the Sneak skill at the Director's difficulty. The
              Director may allow another characteristic, such as Presence to
              blend into a crowd.
          - title: Group tests
            text: |
              When two or more heroes tackle one simple task together with the
              same test, the Director can call a group test: easy, medium or
              hard, like any test. Everyone rolls alone, and none can assist
              another. The test **succeeds** if half or more succeed,
              otherwise it fails.
          - title: Group rewards and consequences
            text: |
              If it succeeds and half or more earned a reward, the group
              gets one collective reward worth two single ones, and
              consequences are ignored. If it fails and more than half
              incurred a consequence, the group gets a collective consequence
              and rewards are ignored: each hero takes a bane on their next
              power roll, or the Director gains 2 [[malice]] per hero. If
              fewer than half earned a reward or consequence, the test simply
              succeeds or fails.
      - type: roll
        dice: 2d10
        label: Assisting a test
        modifier: true
        bands:
          - max: 11
            label: Bane
            text: You get in the way. The creature takes a bane on their test.
          - max: 16
            label: Edge
            text: Your help gives the creature an edge on their test.
          - label: Double edge
            text: Your help gives the creature a double edge on their test.
