  - title: Languages
    blocks:
      - text: |
          If your hero knows a language, they can speak, read, write and
          understand it. The languages below are those of Orden, the
          baseline world; the Director can swap in their own list.
      - type: callout
        title: Every hero knows Caelian
        text: |
          Caelian is the language of the fallen Caelian Empire and is now
          "the common tongue". A second language in Orden is almost always
          Caelian. All player characters know it.
      - type: flaps
        items:
          - title: Languages of the playable peoples
            text: |
              - Devil, hobgoblin: **Anjali** (the language of contract law)
              - Dragon knight, dragon: **Vastariax**
              - Dwarf: **Zaliac** (the language of engineering)
              - High elf: **Hyrallic** (the language of diplomacy)
              - Wode elf: **Yllyric** (the language of druids)
              - Hakaan: **Vhoric**
              - Memonek: **Axiomatic** (also the common trade language of
                the timescape)
              - Orc: **Kalliak**
              - Polder and human: **Khoursirian**
              - Time raider: **Voll**
          - title: Other speaking peoples
            text: |
              - Angulotl: Filliaric
              - Shadow elf: Illyvric
              - Kobold: Kethaic
              - Bugbear, fey: Khelt
              - Bredbeddle, giant, ogre, troll: High Kuric
              - Elemental: Low Kuric
              - Goblin, radenwight: Szetch
              - Higher demon, gnoll: Tholl
              - Lower demon: Proto-Ctholl
              - Olothec, troll, voiceless talker: Variac (the common
                language of the World Below)
              - Voiceless talker: Mindspeech, a symbolic language of
                telepaths
              - Elder dragon: The First Language, the language of magic
              - Overmind: Za'hariax
          - title: Human languages of Vasloria and beyond
            text: |
              - The Gol: Uvalic
              - Higara: Higaran
              - Ix: Oaxuatl
              - Khemhara: Khemharic
              - Khoursir: Khoursirian
              - Phaedros: Phaedran
              - Rioja: Riojan
              - Vanigar: Vaniric
              - Vasloria: Vaslorian
          - title: Dead languages
            text: |
              Much deep lore survives only in ancient writing in languages
              no one speaks any more. These were not codes, just tongues that
              faded, and sages can reconstruct them from modern relatives.
              Reading them helps with crafting and research.
              - **Ananjali** (old hobgoblin): Zodiakol, the bloodmetal
              - **High Rhyvian** (sun elf): Liannar, the sunmetal
              - **Khamish** (beast lord): beast magic
              - **Kheltivari** (old fae): using a wode to travel through time
              - **Low Rhyvian** (sky elf): flying castles
              - **Old Variac** (olothec): Kollar, the sinmetal
              - **Phorialtic** (old elemental): moving between manifolds
              - **Rallarian** (steel dwarf): Valiar, the truemetal
              - **Ullorvic** (star elf): Rovion, the starmetal
          - title: Where you meet them
            text: |
              Hyrallic is a status language: most nobles of every ancestry
              teach it to their children. Yllyric is common among those who
              protect the forests. Zaliac fills the jargon of machines,
              masonry and geology. Anjali fills the jargon of contracts and
              trials. Variac is the common tongue of the World Below.
          - title: Leaving a language open
            text: |
              You can leave a language unchosen until you know which will
              help in the campaign (see Making a Hero).
  - title: Careers
    blocks:
      - text: |
          Being a hero is a calling, not a job. Before you answered it, you
          had a career that paid the bills, and what you learned in it now
          helps you save lives and slay monsters.

          A career does not describe the work in detail; you know the basics
          of what an artisan or a gladiator does. Each career has a list of
          **career questions** to help you fill in the specifics, such as
          "What did you create?" You need not answer them, but telling the
          Director the answers gives them details to work into the game.
      - type: flaps
        title: Career benefits
        items:
          - title: Skills
            text: Two or three skills, depending on the career.
          - title: Languages
            text: |
              Some careers let you learn extra languages from the Languages
              page.
          - title: Renown
            text: |
              Some careers raise your starting [[renown|Renown]] above 0. See Rewards.
          - title: Wealth
            text: |
              Some careers raise your starting [[wealth|Wealth]] above 1. See Rewards.
          - title: Project points
            text: |
              Some careers give [[project points]] you can put toward crafting
              and research projects. You can split them among several
              projects but cannot use them twice, and you still need a
              project's other prerequisites to start it. If the Director
              agrees, your career may also start you with the materials for
              a project, so you can begin before the adventure starts.
          - title: Perk
            text: |
              Each career gives you one perk of a given type, focused outside
              combat. See Perks and Complications.
      - type: flaps
        title: Your inciting incident
        items:
          - title: Inciting incident
            text: |
              Each career has a table of six inciting incidents, each a
              reason you gave up a reliable living to become an adventurer.
              You can roll a d6 for one or choose one. You can also use any
              career's table as inspiration for an incident of your own with
              the Director.
          - title: What was taken from you
            text: |
              During your [[inciting incident]], something was taken: an object
              such as an heirloom, a loved one killed or cursed, or something
              abstract like a chance at happiness or faith in goodness. You
              might want it back, or want to stop others suffering the same
              loss. Write it on your sheet and tell the Director.
      - type: roll
        dice: 1d6
        label: Inciting incident (d6)
        bands:
          - max: 1
            label: "1"
            text: Entry 1 on your career's table.
          - max: 2
            label: "2"
            text: Entry 2.
          - max: 3
            label: "3"
            text: Entry 3.
          - max: 4
            label: "4"
            text: Entry 4.
          - max: 5
            label: "5"
            text: Entry 5.
          - label: "6"
            text: Entry 6.
  - title: The eighteen careers
    blocks:
      - text: |
          Open a career to see its benefits and quick build. Each card
          opens the full entry, with its questions and its six inciting
          incidents.
      - type: cards
        items:
          - title: "Agent"
            entry: careers/agent
            summary: "Spy for a government or organization. Intrigue skills, two languages."
            text: |
              - Skills: The Sneak skill from the intrigue skill group, plus one skill from the interpersonal group and one other skill from the intrigue group.
              - Languages: Two languages.
              - Perk: One intrigue perk.
              - Quick build: Disguise, Lie, Sneak; perk Forgettable Face.
          - title: "Aristocrat"
            entry: careers/aristocrat
            summary: "Born, married or conned into money. Renown +1, Wealth +1."
            text: |
              - Skills: One skill from the interpersonal skill group and one skill from the lore group.
              - Languages: One language.
              - Renown: +1.
              - Wealth: +1.
              - Perk: One lore perk.
              - Quick build: Brag, Society; perk I've Read About This Place.
          - title: "Artisan"
            entry: careers/artisan
            summary: "You made and sold useful wares. Crafting skills, 240 project points."
            text: |
              - Skills: Two skills from the crafting skill group.
              - Languages: One language.
              - Project points: 240.
              - Perk: One crafting perk.
              - Quick build: Blacksmithing, Carpentry; perk Area of Expertise.
          - title: "Beggar"
            entry: careers/beggar
            summary: "You lived on the generosity of crowds. Rumors, two languages."
            text: |
              - Skills: The Rumors skill (from the lore skill group), plus one skill from the exploration group and one skill from the interpersonal group.
              - Languages: Two languages.
              - Perk: One interpersonal perk.
              - Quick build: Empathize, Endurance, Rumors; perk Spot the Tell.
          - title: "Criminal"
            entry: careers/criminal
            summary: "Bandit, smuggler, outlaw or assassin. Criminal Underworld, 120 project points."
            text: |
              - Skills: The Criminal Underworld skill (from the lore skill group), plus two skills from the intrigue group.
              - Languages: One language.
              - Project points: 120.
              - Perk: One intrigue perk.
              - Quick build: Criminal Underworld, Pick Lock, Pick Pocket; perk Criminal Contacts.
          - title: "Disciple"
            entry: careers/disciple
            summary: "Clergy in a church or temple. Religion, 240 project points."
            text: |
              - Skills: The Religion skill (from the lore skill group), plus two more skills from the lore group.
              - Project points: 240.
              - Perk: One supernatural perk.
              - Quick build: Culture, Magic, Religion; perk Ritualist.
          - title: "Explorer"
            entry: careers/explorer
            summary: "Cartographer, researcher or resource finder. Navigate, two languages."
            text: |
              - Skills: The Navigate skill (from the exploration skill group), plus two more skills from the exploration group.
              - Languages: Two languages.
              - Perk: One exploration perk.
              - Quick build: Climb, Heal, Navigate; perk Wood Wise.
          - title: "Farmer"
            entry: careers/farmer
            summary: "You grew crops or cared for livestock. Handle Animals, 120 project points."
            text: |
              - Skills: The Handle Animals skill (from the interpersonal skill group), plus two skills from the exploration group.
              - Languages: One language.
              - Project points: 120.
              - Perk: One exploration perk.
              - Quick build: Drive, Handle Animals, Lift; perk Monster Whisperer.
          - title: "Gladiator"
            entry: careers/gladiator
            summary: "Arena entertainer. Exploration skills, Renown +2."
            text: |
              - Skills: Two skills from the exploration skill group.
              - Languages: One language.
              - Renown: +2.
              - Perk: One exploration perk.
              - Quick build: Gymnastics, Jump; perk Friend Catapult.
          - title: "Laborer"
            entry: careers/laborer
            summary: "Builder, miner, forester and other hard work. Endurance, 120 project points."
            text: |
              - Skills: The Endurance skill (from the exploration skill group), plus two skills from either the crafting group or the exploration group.
              - Languages: One language.
              - Project points: 120.
              - Perk: One exploration perk.
              - Quick build: Blacksmithing, Endurance, Lift; perk Brawny.
          - title: "Mage's Apprentice"
            entry: careers/mages-apprentice
            summary: "Years studying under a mage. Magic, Renown +1."
            text: |
              - Skills: The Magic skill (from the lore skill group), plus two other skills from the lore group.
              - Languages: One language.
              - Renown: +1.
              - Perk: One supernatural perk.
              - Quick build: Magic, Monsters, Timescape; perk Arcane Trick.
          - title: "Performer"
            entry: careers/performer
            summary: "You sing, act or dance for pay. Music or Perform, Renown +2."
            text: |
              - Skills: The Music or Perform skill (from the interpersonal skill group), plus two more skills from the interpersonal group.
              - Renown: +2.
              - Perk: One interpersonal perk.
              - Quick build: Flirt, Music, Perform; perk Harmonizer.
          - title: "Politician"
            entry: careers/politician
            summary: "Leader in a formal organization or government. Renown +1, Wealth +1."
            text: |
              - Skills: Two skills from the interpersonal skill group.
              - Languages: One language.
              - Renown: +1.
              - Wealth: +1.
              - Perk: One interpersonal perk.
              - Quick build: Lead, Lie; perk Engrossing Monologue.
          - title: "Sage"
            entry: careers/sage
            summary: "A life of learning. Two lore skills, 240 project points."
            text: |
              - Skills: Two skills from the lore skill group.
              - Languages: One language.
              - Project points: 240.
              - Perk: One lore perk.
              - Quick build: History, Magic; perk Expert Sage.
          - title: "Sailor"
            entry: careers/sailor
            summary: "Crew on a merchant, military or pirate ship. Swim, two languages."
            text: |
              - Skills: Swim (from the exploration skill group), plus two more skills from the exploration group.
              - Languages: Two languages.
              - Perk: One exploration perk.
              - Quick build: Climb, Gymnastics, Swim; perk Put Your Back Into It!.
          - title: "Soldier"
            entry: careers/soldier
            summary: "You fought in skirmishes and campaigns. Renown +1, two languages."
            text: |
              - Skills: One skill from the exploration skill group and one skill from the intrigue group.
              - Languages: Two languages.
              - Renown: +1.
              - Perk: One exploration perk.
              - Quick build: Alertness, Endurance; perk Teamwork.
          - title: "Warden"
            entry: careers/warden
            summary: "You protected a wild region. Nature, 120 project points."
            text: |
              - Skills: Nature (from the lore skill group), plus one skill from the exploration group and one skill from the intrigue group.
              - Languages: One language.
              - Project points: 120.
              - Perk: One exploration perk.
              - Quick build: Nature, Navigate, Track; perk Camouflage Hunter.
          - title: "Watch Officer"
            entry: careers/watch-officer
            summary: "Officer of the law for a local government. Alertness, two languages."
            text: |
