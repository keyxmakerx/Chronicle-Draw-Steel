title: Culture and Career
intro: Where you grew up, what you did, and the language you speak.
pages:
  - title: Culture
    blocks:
      - text: |
          Your culture is the community that raised you: its beliefs,
          customs and way of life. It stands for **people, not a place**.
          You might have grown up in a great city, but your culture is the
          noble house, pirate crew or sworn order within it. Even a hero who
          rejects their culture was shaped by it.

          A culture has four **aspects**: language, environment,
          organization and upbringing. Tap one to see what it means.
      - type: flaps
        items:
          - title: Language
            text: |
              How your people speak. You learn your culture's language in
              addition to Caelian. See the Languages page.
          - title: Environment
            text: |
              Where your people spend their time: **nomadic, rural,
              secluded, urban or wilderness**.
          - title: Organization
            text: |
              How your people are led: **bureaucratic** or **communal**.
          - title: Upbringing
            text: |
              How you were raised within your culture: **academic,
              creative, labor, lawless, martial or noble**.
      - type: callout
        title: What a culture gives you
        text: |
          - You know your culture's language, plus Caelian.
          - You pick **one skill from each of** the environment,
            organization and upbringing lists.
          - You gain an [[edge]] on tests to recall lore about your culture,
            and on tests to influence or interact with people of it.
      - type: flaps
        items:
          - title: Your culture need not match your ancestry
            text: |
              Many cultures have a majority ancestry, but you can belong to
              one with a different ancestry. A dwarf raised among wode elves
              speaks Yllyric and may know a lot about nature, while a dwarf
              from a dwarf thanedom speaks Zaliac and may know smithing.
              Revenants gain their ancestry only after death, so they have no
              typical ancestry culture.
          - title: Build it your way
            text: |
              Build a culture one aspect at a time, start from a ready-made
              one, or change a ready-made one. Work with the Director to find
              its place in the world.
          - title: But I really want Alertness
            text: |
              If your culture does not offer a skill you want, ask the Director
              to change what its aspects offer. A noble upbringing can
              reasonably include Alertness, since people who covet your power
              keep you watchful.
  - title: Environment, organization, upbringing
    blocks:
      - text: |
          Each aspect lists the skill options it opens, and a quick build.
          You pick one skill from each aspect you choose. Skill groups are
          covered in the Tests chapter.

          **Environment**
      - type: flaps
        items:
          - title: Nomadic
            text: |
              Travels from place to place to survive.
              - **Skill options:** One skill from the exploration or
                interpersonal groups.
              - **Quick build:** Navigate.
          - title: Rural
            text: |
              A town, village or smaller settled enclave, where most folk
              learn a trade.
              - **Skill options:** One skill from the crafting or lore groups.
              - **Quick build:** Nature.
          - title: Secluded
            text: |
              One close-quarters structure, such as a monastery, castle or
              prison, with little contact outside.
              - **Skill options:** One skill from the interpersonal or lore
                groups.
              - **Quick build:** Read Person.
          - title: Urban
            text: |
              Centered in a city of any kind, aboveground or below.
              - **Skill options:** One skill from the interpersonal or
                intrigue groups.
              - **Quick build:** Alertness.
          - title: Wilderness
            text: |
              Thrives in untamed land, taking everything from it.
              - **Skill options:** One skill from the crafting or exploration
                groups.
              - **Quick build:** Endurance.
      - text: '**Organization**'
      - type: flaps
        items:
          - title: Bureaucratic
            text: |
              Official leaders and recorded laws, from a guildmaster to a
              feudal lord to a military. Members learn to use the rules to
              their advantage.
              - **Skill options:** One skill from the interpersonal or
                intrigue groups.
              - **Quick build:** Persuade.
          - title: Communal
            text: |
              Everyone is equal and decisions are shared. Leaders carry out
              what the community decides. Communal cultures often live in
              the wilds or hidden corners and look after themselves.
              - **Skill options:** One skill from the crafting or exploration
                groups.
              - **Quick build:** Jump.
      - text: '**Upbringing**'
      - type: flaps
        items:
          - title: Academic
            text: |
              Raised among people who collect, study and share knowledge.
              - **Skill options:** One skill from the lore group.
              - **Quick build:** History.
          - title: Creative
            text: |
              Raised among makers of art and valuable wares.
              - **Skill options:** Music or Perform, or one skill from the
                crafting group.
              - **Quick build:** Perform.
          - title: Labor
            text: |
              Raised among workers: farmers, hunters, miners, builders.
              - **Skill options:** Blacksmithing (crafting), Handle Animals
                (interpersonal), or a skill from the exploration group.
              - **Quick build:** Lift.
          - title: Lawless
            text: |
              Raised among folk whose activities others call unlawful:
              pirates, assassins, spies, rebels.
              - **Skill options:** One skill from the intrigue group.
              - **Quick build:** Sneak.
          - title: Martial
            text: |
              Raised by warriors: soldiers, mercenaries, monster-slayers.
              - **Skill options:** Blacksmithing or Fletching (crafting);
                Climb, Endurance or Ride (exploration); Intimidate
                (interpersonal); Alertness or Track (intrigue); or Monsters
                or Strategy (lore).
              - **Quick build:** Intimidate.
          - title: Noble
            text: |
              Raised among rulers who play politics to keep power.
              - **Skill options:** One skill from the interpersonal group.
              - **Quick build:** Lead.
  - title: Ready-made cultures
    blocks:
      - text: |
          Pick one as is, or change an aspect to suit your hero. Each card
          shows the aspects it uses and its quick build skills.

          **Typical ancestry cultures** are for a hero raised mostly among
          their own people. Revenants are left out because they gain their
          ancestry only after death.
      - type: cards
        items:
          - title: "Devil"
            entry: cultures/typical-devil
            summary: "Anjali. Urban, bureaucratic, academic."
            text: "Languages: Caelian and Anjali. Environment urban, organization bureaucratic, upbringing academic. Quick build skills: Alertness, Persuade, History."
          - title: "Dragon knight"
            entry: cultures/typical-dragon-knight
            summary: "Vastariax. Secluded, bureaucratic, martial."
            text: "Languages: Caelian and Vastariax. Environment secluded, organization bureaucratic, upbringing martial. Quick build skills: Read Person, Persuade, Intimidate."
          - title: "Dwarf"
            entry: cultures/typical-dwarf
            summary: "Zaliac. Secluded, bureaucratic, creative."
            text: "Languages: Caelian and Zaliac. Environment secluded, organization bureaucratic, upbringing creative. Quick build skills: Read Person, Persuade, Perform."
          - title: "Wode elf"
            entry: cultures/typical-wode-elf
            summary: "Yllyric. Wilderness, bureaucratic, martial."
            text: "Languages: Caelian and Yllyric. Environment wilderness, organization bureaucratic, upbringing martial. Quick build skills: Endurance, Persuade, Intimidate."
          - title: "High elf"
            entry: cultures/typical-high-elf
            summary: "Hyrallic. Secluded, bureaucratic, martial."
            text: "Languages: Caelian and Hyrallic. Environment secluded, organization bureaucratic, upbringing martial. Quick build skills: Read Person, Persuade, Intimidate."
          - title: "Hakaan"
            entry: cultures/typical-hakaan
            summary: "Vhoric. Rural, communal, labor."
            text: "Languages: Caelian and Vhoric. Environment rural, organization communal, upbringing labor. Quick build skills: Nature, Jump, Lift."
          - title: "Human"
            entry: cultures/typical-human
            summary: "Vaslorian. Urban, communal, labor."
            text: "Languages: Caelian and Vaslorian. Environment urban, organization communal, upbringing labor. Quick build skills: Alertness, Jump, Lift."
          - title: "Memonek"
            entry: cultures/typical-memonek
            summary: "Axiomatic. Nomadic, communal, academic."
            text: "Languages: Caelian and Axiomatic. Environment nomadic, organization communal, upbringing academic. Quick build skills: Navigate, Jump, History."
          - title: "Orc"
            entry: cultures/typical-orc
            summary: "Kalliak. Wilderness, communal, creative."
            text: "Languages: Caelian and Kalliak. Environment wilderness, organization communal, upbringing creative. Quick build skills: Endurance, Jump, Perform."
          - title: "Polder"
            entry: cultures/typical-polder
            summary: "Khoursirian. Urban, communal, creative."
            text: "Languages: Caelian and Khoursirian. Environment urban, organization communal, upbringing creative. Quick build skills: Alertness, Jump, Perform."
          - title: "Time raider"
            entry: cultures/typical-time-raider
            summary: "Voll. Nomadic, communal, martial."
            text: "Languages: Caelian and Voll. Environment nomadic, organization communal, upbringing martial. Quick build skills: Navigate, Jump, Intimidate."
      - text: |
          **Archetypical cultures** are quick starting points built on a
          cultural archetype, such as a noble house or a pirate crew. Add a
          language that fits the culture's concept.
      - type: cards
        items:
          - title: "Artisan guild"
            entry: cultures/artisan-guild
            summary: "Urban, bureaucratic, creative."
            text: "Environment urban, organization bureaucratic, upbringing creative. Quick build skills: Alertness, Persuade, Perform. Add a language that fits the culture."
