title: Player screen
intro: The rules you reach for in the middle of a game, a ribbon away on every page.
pages:
  - title: Your turn
    blocks:
      - type: cards
        items:
          - title: Main action
            summary: Most abilities.
            text: |
              The heaviest part of your turn. Most class and kit abilities are
              main actions, along with Charge, Defend, Heal and Free Strike.
          - title: Maneuver
            summary: Something quick.
            text: |
              Lighter than a main action. Aid Attack, Catch Breath, Escape
              Grab, Grab, Hide, Knockback, Stand Up and Use Consumable are
              maneuvers.
          - title: Move action
            summary: Get around.
            text: |
              Getting around the battlefield: Advance, Disengage or Ride.
          - title: Triggered action
            summary: One each round.
            text: |
              Something you can do only when its stated trigger happens, on
              your turn or anyone else's. You get one each round.
      - text: |
          - **Stamina** is your health. You are [[winded]] when it drops to
            half your maximum, and [[dying]] when it reaches zero.
          - A [[recovery]] heals you for a third of your maximum Stamina,
            rounded down.
          - A [[saving throw]] is a d10 rolled at the end of your turn. On a 6
            or higher, an effect that says "save ends" stops.
  - title: The power roll
    blocks:
      - type: roll
        dice: 2d10
        label: Power roll
        modifier: true
        bands:
          - max: 11
            label: Tier 1
            text: 11 or lower. The weakest result.
          - max: 16
            label: Tier 2
            text: 12 to 16. A solid result.
          - label: Tier 3
            text: 17 or higher. The strongest result.
      - type: callout
        title: Edges and banes
        text: |
          An [[edge]] adds 2 to the roll and a [[bane]] takes 2 away.

          - A **double edge** raises the result by a whole tier instead.
          - A **double bane** lowers it by a whole tier instead.
          - One edge and one bane cancel each other out.
  - title: Conditions
    blocks:
      - type: cards
        items:
          - title: Bleeding
            text: Whenever a bleeding creature uses a main action, uses a triggered action, or makes a test or ability roll using Might or Agility, they lose Stamina equal to 1d6 + their level once it is resolved. Nothing can prevent the loss, and it happens once per action.
          - title: Dazed
            text: "A dazed creature can do only one thing on their turn: use a main action, a maneuver or a move action. They can't use triggered actions, free triggered actions or free maneuvers."
          - title: Frightened
            text: A frightened creature's ability rolls against the source of their fear take a bane, and that source's ability rolls against them gain an edge. They can't willingly move closer to the source if they know where it is.
          - title: Grabbed
            text: A grabbed creature has speed 0, can be force moved only by whatever has them grabbed, can't use the Knockback maneuver, and takes a bane on abilities that don't target their grabber. They can try to get free with the Escape Grab maneuver.
          - title: Hidden
            text: A creature can't target someone hidden from them with abilities that lack the Area keyword, and the hidden creature gains an edge on ability rolls against them. Using an ability or losing cover or concealment ends it.
          - title: Prone
            text: A prone creature's strikes take a bane and melee abilities used against them gain an edge. They must crawl, which costs 1 extra square of movement for every square, and they get up with the Stand Up maneuver.
          - title: Restrained
            text: A restrained creature has speed 0, can't use the Stand Up maneuver and can't be force moved. They take a bane on ability rolls and on Might and Agility tests, and abilities used against them gain an edge.
          - title: Slowed
            text: A slowed creature has speed 2 unless their speed is already lower, and they can't shift.
          - title: Surprised
            text: A creature who isn't ready for combat when it starts is surprised until the end of the first combat round.
          - title: Taunted
            text: A taunted creature has a double bane on ability rolls for any ability that doesn't target the creature who taunted them, as long as they have line of effect to that creature.
          - title: Weakened
            text: A weakened creature takes a bane on power rolls.
