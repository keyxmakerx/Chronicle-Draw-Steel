title: Handbook
mark: DS
turn: flip
glossary: rules-glossary.json
look: bold
cover: art/cover.svg
fonts:
  - family: "Big Shoulders Display"
    file: fonts/big-shoulders-display-latin-700-normal.woff2
    weight: 700
  - family: "Big Shoulders Display"
    file: fonts/big-shoulders-display-latin-900-normal.woff2
    weight: 900
  - family: "Barlow Semi Condensed"
    file: fonts/barlow-semi-condensed-latin-500-normal.woff2
    weight: 500
  - family: "Barlow Semi Condensed"
    file: fonts/barlow-semi-condensed-latin-600-normal.woff2
    weight: 600
  - family: "Barlow Semi Condensed"
    file: fonts/barlow-semi-condensed-latin-700-normal.woff2
    weight: 700
  - family: "Source Serif 4"
    file: fonts/source-serif-4-latin-400-normal.woff2
    weight: 400
  - family: "Source Serif 4"
    file: fonts/source-serif-4-latin-400-italic.woff2
    weight: 400
    style: italic
  - family: "Source Serif 4"
    file: fonts/source-serif-4-latin-600-normal.woff2
    weight: 600
theme:
  paper: "#f1f2f4"
  paper-alt: "#ffffff"
  ink: "#15171d"
  ink-soft: "#4b5261"
  muted: "#6b7280"
  edge: "#cbd1da"
  accent: "#c22f39"
  cover: "#232833"
  heading-font: '"Big Shoulders Display", Oswald, "Arial Narrow", Impact, sans-serif'
  body-font: '"Source Serif 4", Georgia, serif'
  ui-font: '"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif'
first: front
screen: players-screen
parts:
  - title: Player's book
    chapters:
      - front
      - how-to-play
      - players-screen
      - basics
      - making-a-hero
      - ancestries
      - culture-and-career
      - classes
      - kits
      - perks-and-complications
      - tests
      - combat
      - negotiation
      - montages
      - downtime
      - rewards
  - title: Director's book
    director: true
    chapters:
      - running-the-game
      - building-encounters
      - monsters
  - title: Credits
    chapters:
      - credits
